<style>
.resident-header { height: 56px; min-height: 56px; box-sizing: border-box; }
.resident-search { width: 296px; height: 36px; min-height: 36px; box-sizing: border-box; border-radius: 9999px; }
.resident-profile-image { width: 32px; height: 32px; min-width: 32px; border-radius: 9999px; object-fit: cover; }
@media (max-width: 639px) { .resident-search { width: min(220px, 52vw); } .resident-header-username { display: none; } }
</style>
<header class="resident-header border-b border-outline-variant bg-surface-container-lowest flex items-center justify-end px-5 md:px-8 sticky top-0 z-40 w-full">
<div class="flex items-center gap-4 w-full justify-end">
<form method="GET" action="{% url 'public_board' %}" class="relative">
<label class="sr-only" for="resident-search">Search reports or news</label>
<input id="resident-search" name="q" value="{{ search_query|default:'' }}" type="search" placeholder="Search reports or news..." class="resident-search border border-outline-variant bg-background py-2 pl-10 pr-4 text-sm text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-base text-on-surface-variant">search</span>
</form>
<a href="{% url 'notification_list' %}" aria-label="Notifications" class="relative rounded-full p-2 text-on-surface-variant hover:bg-surface-container-low">
<span class="material-symbols-outlined">notifications</span>
{% if unread_notifications_count %}<span class="absolute right-1 top-1 min-w-4 h-4 px-1 rounded-full bg-error text-white text-[10px] font-bold flex items-center justify-center">{{ unread_notifications_count }}</span>{% endif %}
</a>
<a class="flex items-center gap-2 text-sm font-semibold text-on-surface" href="{% url 'profile' %}">
{% if request.user.profile.profile_picture %}
<img class="resident-profile-image" src="{{ request.user.profile.profile_picture.url }}" alt="Profile picture">
{% else %}
<span class="material-symbols-outlined text-3xl text-on-surface-variant">account_circle</span>
{% endif %}
<span class="resident-header-username">{{ request.user.username }}</span>
</a>
</div>
</header>
